name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

    steps:
      - name: Check out the pushed revision
        # actions/checkout v7.0.1, pinned to its full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          for variable in VPS_HOST VPS_USER VPS_PORT VPS_DEPLOY_PATH VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required GitHub secret ${variable} is missing." >&2
              exit 1
            fi
          done

          if [[ ! "$VPS_PORT" =~ ^[0-9]+$ ]] || (( VPS_PORT < 1 || VPS_PORT > 65535 )); then
            echo "VPS_PORT must be a valid TCP port." >&2
            exit 1
          fi

          if [[ ! "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "VPS_DEPLOY_PATH must be an absolute Linux path without spaces." >&2
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./.next' \
            --exclude='./artifacts' \
            --exclude='./.env' \
            --exclude='./.env.local' \
            --exclude='./.env.production' \
            --exclude='*.log' \
            -czf "$RUNNER_TEMP/bourse-collector-${GITHUB_SHA}.tar.gz" .

      - name: Check VPS prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$1"
          release_sha="$2"

          if [[ "$deploy_path" != /* ]] || [[ ${#deploy_path} -lt 8 ]]; then
            echo "VPS_DEPLOY_PATH must be a specific absolute path." >&2
            exit 1
          fi

          case "$deploy_path" in
            /|/bin|/boot|/dev|/etc|/home|/opt|/root|/run|/srv|/usr|/var)
              echo "Refusing broad VPS_DEPLOY_PATH: $deploy_path" >&2
              exit 1
              ;;
          esac

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release revision." >&2
            exit 1
          fi

          command -v docker >/dev/null || { echo "Docker is not installed on the VPS." >&2; exit 1; }
          docker compose version >/dev/null || { echo "Docker Compose v2 is not installed on the VPS." >&2; exit 1; }
          command -v openssl >/dev/null || { echo "OpenSSL is required to generate the database password." >&2; exit 1; }

          mkdir -p "$deploy_path/shared" "$deploy_path/releases/$release_sha"
          env_file="$deploy_path/shared/.env"
          touch "$env_file"
          chmod 600 "$env_file"
          sed -i 's/\r$//' "$env_file"

          database_config_complete=1
          for variable in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            if ! grep -Eq "^${variable}=.+$" "$env_file"; then
              database_config_complete=0
            fi
          done

          if (( database_config_complete == 0 )); then
            if docker volume inspect bourse-collector_postgres_data >/dev/null 2>&1; then
              echo "Database variables are missing, but an initialized PostgreSQL volume already exists." >&2
              echo "Restore POSTGRES_DB, POSTGRES_USER, and POSTGRES_PASSWORD in $env_file instead of generating new credentials." >&2
              exit 1
            fi

            for variable in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
              sed -i "/^${variable}=/d" "$env_file"
            done

            {
              printf 'POSTGRES_DB=bourse\n'
              printf 'POSTGRES_USER=bourse\n'
              printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            } >> "$env_file"
            chmod 600 "$env_file"
            echo "Generated persistent PostgreSQL credentials in $env_file"
          fi
          REMOTE

      - name: Upload release
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/bourse-collector-${GITHUB_SHA}.tar.gz" \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/releases/$GITHUB_SHA/release.tar.gz"

      - name: Start release and verify health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$1"
          release_sha="$2"
          release_path="$deploy_path/releases/$release_sha"
          previous_release=""

          if [[ -L "$deploy_path/current" ]]; then
            previous_release="$(readlink -f "$deploy_path/current")"
          fi

          tar -xzf "$release_path/release.tar.gz" -C "$release_path"
          rm -f "$release_path/release.tar.gz"
          ln -sfn "$deploy_path/shared/.env" "$release_path/.env"

          ln -sfn "$release_path" "$deploy_path/current.next"
          mv -Tf "$deploy_path/current.next" "$deploy_path/current"

          cd "$deploy_path/current"
          deploy_ok=1
          if ! docker compose up -d --build --remove-orphans; then
            deploy_ok=0
          fi

          if (( deploy_ok == 1 )); then
            healthy=0
            for attempt in $(seq 1 60); do
              worker_id="$(docker compose ps -q worker)"
              if docker compose exec -T app node -e \
                "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" \
                && [[ -n "$worker_id" ]] \
                && [[ "$(docker inspect --format '{{.State.Health.Status}}' "$worker_id" 2>/dev/null)" == "healthy" ]]; then
                healthy=1
                break
              fi
              sleep 5
            done

            if (( healthy == 0 )); then
              deploy_ok=0
            fi
          fi

          if (( deploy_ok == 0 )); then
            echo "Deployment failed. Recent service logs:" >&2
            docker compose logs --tail=150 app worker migrate >&2 || true

            if [[ -n "$previous_release" && -d "$previous_release" ]]; then
              echo "Restoring previous application release: $previous_release" >&2
              ln -sfn "$previous_release" "$deploy_path/current.rollback"
              mv -Tf "$deploy_path/current.rollback" "$deploy_path/current"
              cd "$deploy_path/current"
              docker compose up -d --build --remove-orphans || true
            else
              echo "No previous release is available for automatic rollback." >&2
            fi
            exit 1
          fi

          docker compose ps
          echo "Successfully deployed revision $release_sha"
          REMOTE

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/bourse-collector-${GITHUB_SHA}.tar.gz"
